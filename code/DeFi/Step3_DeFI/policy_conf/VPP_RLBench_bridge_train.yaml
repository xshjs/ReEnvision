defaults:
  - datamodule: rlbench_bridge

ckpt_path:
root_data_dir:
train_folder:
lang_folder: lang_clip_resnet50

min_window_size: 21
max_window_size: 50
future_range: 29
seed: 242
batch_size: 8
max_epochs: 6
log_every: 50
window_sampling_strategy: 'geometric'
num_workers: 8
img_gen_frame_diff: 3

act_seq_len: 1
obs_seq_len: 1

model:
  _target_: policy_models.RLBench_bridge_policy.RLBenchBridgePolicy
  _recursive_: false
  latent_dim: 384
  multistep: 1
  use_lr_scheduler: true
  act_window_size: ${act_seq_len}
  obs_seq_len: ${obs_seq_len}
  action_dim: 9
  action_seq_len: ${act_seq_len}
  action_head_type: rlbench_bridge
  n_trans_bins: 100
  n_rot_bins: 72
  waypoint_hidden_dim: 512
  trans_loss_weight: 1.0
  rot_loss_weight: 1.0
  gripper_loss_weight: 0.2
  collision_loss_weight: 1.0
  scene_bounds: [-0.3, -0.5, 0.6, 0.7, 0.5, 1.6]
  voxel_size: 100
  mvt_token_dim: 256
  mvt_max_tokens: 256
  mvt_transformer_depth: 4
  use_text_not_embedding: True
  seed: ${seed}
  Former_depth: 6
  Former_heads: 8
  Former_dim_head: 64
  Former_num_time_embeds: 16
  num_latents: 224
  pretrained_model_path:
  text_encoder_path:
  t5_model_path:
  language_goal_path: ckpt/ViT-B-32.pt
  use_position_encoding: False
  use_Former: 3d
  timestep: 20
  use_all_layer: True
  extract_layer_idx: 1
  optimizer:
    _target_: torch.optim.AdamW
    transformer_weight_decay: 0.05
    learning_rate: 1e-4
    betas: [0.9, 0.9]
  lr_scheduler:
    lr_scheduler:
      init_lr: 1e-4
      init_lr_scale: 0.1
      final_lr_scale: 1e-6
      total_steps: 50000
      phase_ratio: "(0.02, 0.08, 0.9)"
      lr: 1e-4
